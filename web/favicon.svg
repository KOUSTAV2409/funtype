<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#f5c2e7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#313244" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#45475a" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- Keycap effect -->
  <path d="M12 16 C12 14 14 12 16 12 L48 12 C50 12 52 14 52 16 L50 48 C50 50 48 52 46 52 L18 52 C16 52 14 50 14 48 Z" fill="#181825" opacity="0.6"/>
  <!-- Lightning Bolt -->
  <path d="M35 14 L21 34 L31 34 L27 50 L43 28 L33 28 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
